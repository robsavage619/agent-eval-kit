[project]
name = "agent-eval-kit"
version = "0.2.0"
description = "Golden-set evals for LLM agents that check their own checks: confidence intervals, flaky-case detection, judge calibration, and trajectory evals."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40.0",
]
examples = [
    "anthropic>=0.40.0",
    "langgraph>=0.2.0",
]
dev = [
    "ruff>=0.9.0",
    "pyright>=1.1.390",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
aek = "agent_eval_kit.cli:main"

[project.urls]
Repository = "https://github.com/robsavage619/agent-eval-kit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval_kit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "anthropic>=0.40.0",
    "pyright>=1.1.409",
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
