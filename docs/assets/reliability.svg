<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="760" height="340" fill="#ffffff"/>
