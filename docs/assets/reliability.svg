<text x="580.0" y="302" font-size="12" fill="#64748b" text-anchor="middle">k = 5</text>
<polyline points="70.0,145.6 197.5,198.4 325.0,222.4 452.5,232.0 580.0,232.0" fill="none" stroke="#e11d48" stroke-width="3"/>
<circle cx="70.0" cy="145.6" r="4.5" fill="#e11d48"/>
<circle cx="197.5" cy="198.4" r="4.5" fill="#e11d48"/>
<circle cx="325.0" cy="222.4" r="4.5" fill="#e11d48"/>
<circle cx="452.5" cy="232.0" r="4.5" fill="#e11d48"/>
