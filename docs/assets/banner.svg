<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151b33"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- interval glyphs: each case is a point estimate with the uncertainty drawn around it -->
  <g stroke-linecap="round">
    <g transform="translate(860 0)" stroke-width="3">
      <line x1="40" x2="40" y1="92" y2="150" stroke="#334155"/>
      <circle cx="40" cy="120" r="7" fill="#22d3ee"/>
      <line x1="90" x2="90" y1="70" y2="182" stroke="#334155"/>
      <circle cx="90" cy="128" r="7" fill="#22d3ee"/>
      <line x1="140" x2="140" y1="104" y2="140" stroke="#334155"/>
      <circle cx="140" cy="122" r="7" fill="#22d3ee"/>
      <line x1="190" x2="190" y1="150" y2="246" stroke="#334155"/>
      <circle cx="190" cy="206" r="7" fill="#fb7185"/>
      <line x1="240" x2="240" y1="96" y2="160" stroke="#334155"/>
      <circle cx="240" cy="126" r="7" fill="#22d3ee"/>
      <line x1="290" x2="290" y1="112" y2="136" stroke="#334155"/>
      <circle cx="290" cy="124" r="7" fill="#22d3ee"/>
      <line x1="10" x2="330" y1="124" y2="124" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 8"/>
    </g>
  </g>

  <text x="96" y="140" font-size="64" font-weight="700" fill="#f8fafc" letter-spacing="-1">agent-eval-kit</text>
  <text x="98" y="190" font-size="26" fill="#cbd5e1">Evals for LLM agents that check their own checks.</text>
  <text x="98" y="236" font-size="18" fill="#64748b">confidence intervals  ·  flaky cases  ·  noise-aware diffs  ·  judge calibration  ·  trajectories</text>
</svg>
